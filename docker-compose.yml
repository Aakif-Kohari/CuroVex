services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change_me}
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=2G
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-curovex}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - POSTGRES_DB=${POSTGRES_DB:-curovex}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-change_me}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-curovex}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - POSTGRES_DB=${POSTGRES_DB:-curovex}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change_me_to_a_random_string}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - MODEL_PATH=${MODEL_PATH:-ml-core/artifacts/gat_link_predictor.pt}
      - DATA_DIR=${DATA_DIR:-kg-pipeline/data/normalized}
    volumes:
      - ./api:/app/api
      - ./ml-core:/app/ml-core
      - ./explainability:/app/explainability
      - ./validation:/app/validation
    depends_on:
      - neo4j
      - postgres
      - redis

  celery-worker:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    command: celery -A api.celery_app worker --loglevel=info
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-change_me}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-curovex}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - POSTGRES_DB=${POSTGRES_DB:-curovex}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change_me_to_a_random_string}
      - MODEL_PATH=${MODEL_PATH:-ml-core/artifacts/gat_link_predictor.pt}
      - DATA_DIR=${DATA_DIR:-kg-pipeline/data/normalized}
    volumes:
      - ./api:/app/api
      - ./ml-core:/app/ml-core
      - ./explainability:/app/explainability
      - ./validation:/app/validation
    depends_on:
      - redis
      - postgres

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api

volumes:
  neo4j_data:
  postgres_data:
